<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Pannello Inqui</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--fondo:#1f1442;--carta:#2b1d5c;--testo:#fff;--tenue:#c9c0ee;--rosa:#ff7aa8;--giallo:#ffb020;--verde:#22b8a7;--viola:#7c5cff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--fondo);color:var(--testo);font-family:Nunito,system-ui,sans-serif}
body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px 16px}
.box{width:100%;max-width:360px;background:var(--carta);border-radius:28px;padding:32px 24px 28px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35)}
h1{font-family:Fredoka,Nunito,sans-serif;font-weight:600;font-size:28px;margin:14px 0 4px}
h1 span{background:linear-gradient(transparent 58%,rgba(255,122,168,.55) 58%)}
p{margin:0 0 22px;color:var(--tenue);font-size:15px}
label{display:block;text-align:left;font-weight:700;font-size:14px;margin-bottom:6px}
input[type=password]{width:100%;font:inherit;font-size:17px;padding:14px 16px;border-radius:16px;border:2px solid transparent;background:#fff;color:#1f1442;outline:none}
input[type=password]:focus{border-color:var(--giallo)}
.ric{display:flex;gap:8px;align-items:center;justify-content:flex-start;margin:14px 2px 20px;font-size:14px;color:var(--tenue);font-weight:600}
.ric input{width:18px;height:18px;accent-color:var(--giallo)}
button{width:100%;font-family:Fredoka,Nunito,sans-serif;font-size:18px;font-weight:600;padding:14px;border:0;border-radius:16px;background:var(--giallo);color:#1f1442;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{min-height:22px;margin-top:12px;color:var(--rosa);font-weight:700;font-size:14px}
</style>
</head>
<body>
<form class="box" id="f" autocomplete="on">
  <svg width="72" height="58" viewBox="0 0 72 58" aria-hidden="true"><path d="M36 4 6 26v28h60V26z" fill="#fff"/><rect x="16" y="30" width="16" height="10" rx="2" fill="#ffb020"/><rect x="40" y="30" width="16" height="10" rx="2" fill="#ff7aa8"/><rect x="16" y="42" width="16" height="8" rx="2" fill="#22b8a7"/><rect x="40" y="42" width="16" height="8" rx="2" fill="#7c5cff"/></svg>
  <h1><span>Pannello Inqui</span></h1>
  <p>Solo per il team</p>
  <input type="text" name="username" value="team" autocomplete="username" hidden>
  <label for="pw">Password</label>
  <input type="password" id="pw" name="password" autocomplete="current-password" required>
  <label class="ric"><input type="checkbox" id="ric"> Ricordami su questo dispositivo</label>
  <button type="submit" id="b">Entra</button>
  <div class="err" id="e" role="alert"></div>
</form>

function b64(s){ var x = atob(s), u = new Uint8Array(x.length); for (var i = 0; i < x.length; i++) u[i] = x.charCodeAt(i); return u; }
function apri(pw){
  var enc = new TextEncoder();
  return crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey'])
    .then(function(k){ return crypto.subtle.deriveKey({ name:'PBKDF2', salt:b64(P.s), iterations:P.n, hash:'SHA-256' }, k, { name:'AES-GCM', length:256 }, false, ['decrypt']); })
    .then(function(k){ return crypto.subtle.decrypt({ name:'AES-GCM', iv:b64(P.i) }, k, b64(P.d)); })
    .then(function(buf){ return new TextDecoder().decode(buf); });
}
function mostra(h){ document.open(); document.write(h); document.close(); }
var CH = 'pannello-inqui';
function leggi(){ try { return localStorage.getItem(CH); } catch(e) { return null; } }
function scrivi(v){ try { if (v) localStorage.setItem(CH, v); else localStorage.removeItem(CH); } catch(e) {} }
var salvata = leggi();
if (salvata) apri(salvata).then(mostra, function(){ scrivi(null); });
document.getElementById('f').addEventListener('submit', function(ev){
  ev.preventDefault();
  var pw = document.getElementById('pw').value, b = document.getElementById('b'), e = document.getElementById('e');
  b.disabled = true; b.textContent = 'Apro…'; e.textContent = '';
  var ric = document.getElementById('ric').checked;
  apri(pw).then(function(h){ scrivi(ric ? pw : null); mostra(h); })
    .catch(function(){ b.disabled = false; b.textContent = 'Entra'; e.textContent = 'Password sbagliata'; });
});
